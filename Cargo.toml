[package]
name = "ai-image-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "MCP server for image generation through SuperGrok, ChatGPT/Codex, OpenAI, Gemini, and fal"
repository = "https://github.com/lassejlv/ai-image-mcp"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive", "env"] }
dirs = "7.0.0"
futures = "0.3.34"
hmac = "0.13.0"
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = "1.0.2"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "multipart", "rustls", "http2"] }
rmcp = { version = "3.11", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "json", "tls-rustls-aws-lc-rs"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "fs", "sync", "time"] }
toml = { version = "1.2.2", features = ["preserve_order"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "3.11", features = ["client", "transport-io"] }
tempfile = "3.27.0"
wiremock = "0.6.5"
