<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ai-image-mcp</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="app.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="top">
      <span class="brand">
        <svg class="mark" viewBox="200 200 625 625" fill="none" aria-hidden="true">
          <defs>
          <mask id="cut-a"><rect width="1024" height="1024" fill="#fff"/><rect x="294" y="294" width="437" height="437" rx="96" fill="#000"/></mask>
          <mask id="cut-b"><rect width="1024" height="1024" fill="#fff"/><rect x="384" y="384" width="437" height="437" rx="96" fill="#000"/></mask>
          <mask id="cut-star"><rect width="1024" height="1024" fill="#fff"/><path d="M603 545Q612 594 661 603Q612 612 603 661Q594 612 545 603Q594 594 603 545Z" fill="#000"/></mask>
          </defs>
          <g fill="none" stroke="currentColor" stroke-width="37">
          <rect x="248.5" y="248.5" width="346" height="346" rx="52" mask="url(#cut-a)"/>
          <rect x="338.5" y="338.5" width="346" height="346" rx="52" mask="url(#cut-b)"/>
          </g>
          <rect x="410" y="410" width="385" height="385" rx="70" fill="currentColor" mask="url(#cut-star)"/>
        </svg>
        ai-image-mcp
      </span>
      <nav>
        <a href="#create" data-view="create">Create</a>
        <a href="#providers" data-view="providers">Providers</a>
      </nav>
      <form id="sign-out" class="sign-out" method="post" action="logout" hidden>
        <button class="ghost" type="submit">Sign out</button>
      </form>
    </header>

    <main>
      <section id="view-create" class="create">
        <form id="generate" class="form" novalidate>
          <label class="field">
            <span>Prompt</span>
            <textarea name="prompt" rows="5" placeholder="A lighthouse at dawn, watercolor"></textarea>
          </label>
          <div class="row">
            <label class="field">
              <span>Provider</span>
              <select name="provider"></select>
            </label>
            <label class="field">
              <span>Model</span>
              <input name="model" list="models" autocomplete="off" />
              <datalist id="models"></datalist>
            </label>
          </div>
          <details class="settings">
            <summary>Settings</summary>
            <div id="settings" class="settings-grid"></div>
            <label class="field">
              <span>Extra (JSON, sent to the provider as is)</span>
              <textarea name="extra" rows="3" class="mono" placeholder='{"moderation": "low"}'></textarea>
            </label>
          </details>
          <div class="inputs">
            <label class="file-button">
              <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple />
              <span>Add reference images</span>
            </label>
            <span id="input-limit" class="quiet"></span>
            <div id="input-list" class="input-list"></div>
          </div>
          <button id="submit" class="primary" type="submit">
            <span class="spinner" hidden></span>
            <span class="label">Generate</span>
          </button>
          <p id="form-note" class="note" hidden></p>
        </form>

        <div class="canvas">
          <div id="result" class="result">
            <p class="empty">Images you generate appear here.</p>
          </div>
          <p id="result-meta" class="quiet mono"></p>
          <h2 class="section-title">Recent</h2>
          <div id="gallery" class="gallery"></div>
          <p id="gallery-empty" class="quiet" hidden>Nothing saved yet.</p>
        </div>
      </section>

      <section id="view-providers" class="providers" hidden>
        <ul id="provider-list" class="provider-list"></ul>
        <p class="quiet">Images are saved to <span id="storage" class="mono"></span></p>
      </section>
    </main>
  </body>
</html>
